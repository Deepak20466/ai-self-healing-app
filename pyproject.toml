[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-self-healing"
version = "0.1.0"
description = "AI-Powered Self-Healing Application with MCP Server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "python-socketio>=5.11,<6.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "mcp>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "argon2-cffi>=23.1,<24.0",
  "itsdangerous>=2.2,<3.0",
  "structlog>=24.4",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "psutil>=6.0",
]

[project.optional-dependencies]
# API-mode backend (USE_CLAUDE_CODE=false). Free mode (the default) never
# imports `anthropic` (see healer/anthropic_client.py), so it isn't a base
# dependency — installed with `pip install .[api]` only when API mode is used.
api = [
  "anthropic>=0.39",
]
dev = [
  # mypy strict-checks healer/anthropic_client.py's TYPE_CHECKING-only
  # `import anthropic` regardless of which backend is active, so dev tooling
  # needs it installed even on a machine that only ever runs free mode.
  "anthropic>=0.39",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "respx>=0.21",
  "ruff>=0.7",
  "mypy>=1.11",
  "honcho>=1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "sentinel*", "mcp_server*", "healer*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]
"scripts/*" = ["S105", "S106", "S603", "S607"]
# Internal subprocess helpers with multiple call sites and a sensible
# `timeout=` default; wrapping every caller in `asyncio.timeout()` instead
# would add boilerplate at each of them for no real benefit here (unlike
# core/queue.py's single-caller HealJobListener.wait()).
"mcp_server/git_utils.py" = ["ASYNC109"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented dependency-injection idiom is exactly `= Depends(...)`
# in an argument default; it's evaluated once at route-registration time, not
# per-call, so B008's "don't call functions in defaults" concern doesn't apply.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "core.*"
strict = true

[[tool.mypy.overrides]]
module = "sentinel.*"
strict = true

[[tool.mypy.overrides]]
module = "mcp_server.*"
strict = true

[[tool.mypy.overrides]]
module = "healer.*"
strict = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "socketio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "argon2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# core.db.engine is a module-level singleton whose asyncpg connection pool is
# bound to whichever event loop first created it. Function-scoped loops (the
# pytest-asyncio default) tear down and recreate a loop per test, so pooled
# connections from one test outlive their loop and blow up on cleanup under
# Windows' ProactorEventLoop. A single session-scoped loop matches how the
# engine is actually used in production (one loop for the process lifetime).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["core", "sentinel", "mcp_server", "healer"]
