name: CI

on:
  push:
    branches: ["main", "autofix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: selfheal
          POSTGRES_PASSWORD: selfheal
          POSTGRES_DB: selfheal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U selfheal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://selfheal:selfheal@localhost:5432/selfheal_test
      TEST_DATABASE_URL: postgresql+asyncpg://selfheal:selfheal@localhost:5432/selfheal_test
      SESSION_SECRET: ci-only-not-a-real-secret
      HEALER_WEBHOOK_SECRET: ci-only-not-a-real-secret
      ADMIN_PASSWORD_HASH: ""
      USE_CLAUDE_CODE: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth=1) clone: several
          # healer tests (test_healer_worktree.py, test_healer_ci_agent.py,
          # test_healer_runtime_agent.py) push real commits from this
          # checkout to a throwaway local bare repo to test the worktree/PR
          # lifecycle, and git refuses to push a shallow ref to another repo
          # ("shallow update not allowed") -- reproduced for real in CI.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure git identity for test commits
        # The healer's own worktree lifecycle tests (and the free-mode/
        # runtime-agent end-to-end tests) make real `git commit`s in
        # throwaway worktrees/branches. The Actions runner has no git
        # identity configured by default, which fails every such commit
        # with "fatal: empty ident name" -- reproduced for real in CI.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Ensure a local 'main' branch exists
        # On a pull_request-triggered run, actions/checkout leaves HEAD
        # detached at the PR's merge commit and never creates a local branch
        # named "main" -- but many tests (git_utils, worktree, ci_agent, mcp
        # sandbox/code tools) create worktrees/branches off a literal "main"
        # ref, and fail with "invalid reference: main" / "not a valid object
        # name: main" (reproduced for real in CI on PR #10's own pull_request
        # run). A push-triggered run already has "main" locally, so this is a
        # no-op there.
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - name: Report CI start to healer webhook
        if: always() && vars.HEALER_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          HEALER_WEBHOOK_URL: ${{ vars.HEALER_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.HEALER_WEBHOOK_SECRET }}
        run: python scripts/ci_webhook_notify.py --status started

      - name: ruff check
        id: ruff_check
        run: ruff check .

      - name: ruff format --check
        id: ruff_format
        run: ruff format --check .

      - name: mypy (strict on core/sentinel/mcp_server/healer)
        id: mypy
        run: mypy core sentinel mcp_server healer

      - name: pytest with coverage
        id: pytest
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Report CI finish to healer webhook
        if: always() && vars.HEALER_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          HEALER_WEBHOOK_URL: ${{ vars.HEALER_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.HEALER_WEBHOOK_SECRET }}
          JOB_CONCLUSION: ${{ job.status }}
        run: python scripts/ci_webhook_notify.py --status finished --conclusion "$JOB_CONCLUSION"
