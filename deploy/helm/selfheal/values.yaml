# Ephemeral/CI defaults. Dummy secrets are fine here -- see CLAUDE.md's
# "Environment on this machine" convention: real secrets never belong in a
# chart's own committed defaults, and this cluster is torn down every run.

image:
  registry: ""
  tag: "ci"
  pullPolicy: IfNotPresent
  repository:
    app: selfheal-app
    sentinel: selfheal-sentinel
    mcp: selfheal-mcp
    healer: selfheal-healer

# A plain Deployment using the official postgres:16-alpine image, not a
# Helm subchart -- an earlier version of this chart depended on the Bitnami
# `postgresql` subchart, but Bitnami removed the specific free-tier image
# tag that chart version pinned (docker.io/bitnami/postgresql:17.6.0-
# debian-12-r4 404s as of this session, part of Bitnami's move of older
# free tags behind a paid "Secure Images" registry) -- confirmed live via a
# real k8s-ci run, not assumed. `postgres:16-alpine` is small, official,
# and has no such registry-migration risk; simplest robust option for an
# ephemeral, no-persistence CI cluster.
postgresql:
  image: "postgres:16-alpine"
  username: selfheal
  password: selfheal
  database: selfheal
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

env:
  environment: development
  logLevel: INFO
  aiBackend: api
  # Deliberately invalid/unreachable so any accidentally-triggered heal job
  # fails closed instead of spending real AI budget -- the same pattern
  # CLAUDE.md documents for running scripts/verify_all.py locally.
  anthropicApiKey: "invalid"
  anthropicBaseUrl: "http://127.0.0.1:9"
  githubToken: "ci-dummy-token"
  githubRepo: "owner/repo"
  sessionSecret: "ci-only-session-secret-not-a-real-secret"
  healerWebhookSecret: "ci-only-webhook-secret-not-a-real-secret"
  sentinelIngestToken: "ci-only-ingest-token"
  # argon2 hash of "ci-password" -- fine to commit, it's a throwaway
  # cluster's own login and nothing else trusts it.
  adminPasswordHash: "$argon2id$v=19$m=65536,t=3,p=4$c2VsZmhlYWxjaXNhbHQ$K3M0000000000000000000000000000000000000000"
  autoMerge: "false"

app:
  port: 8001
sentinel:
  port: 8002
mcp:
  port: 8003
healer:
  port: 8000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 300Mi

probes:
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 6
