name: CI failure -> AI fix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  notify-on-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: POST the failed run to the healer webhook (starts the AI CI-fix flow)
        env:
          HEALER_WEBHOOK_URL: ${{ vars.HEALER_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.HEALER_WEBHOOK_SECRET }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_WORKFLOW: ${{ github.event.workflow_run.name }}
          GITHUB_REF_NAME: ${{ github.event.workflow_run.head_branch }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: python scripts/ci_webhook_notify.py --status finished --conclusion failure
