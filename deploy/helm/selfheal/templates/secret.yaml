apiVersion: v1
kind: Secret
metadata:
  name: selfheal-secrets
type: Opaque
stringData:
  session-secret: {{ .Values.env.sessionSecret | quote }}
  healer-webhook-secret: {{ .Values.env.healerWebhookSecret | quote }}
  sentinel-ingest-token: {{ .Values.env.sentinelIngestToken | quote }}
  github-token: {{ .Values.env.githubToken | quote }}
  admin-password-hash: {{ .Values.env.adminPasswordHash | quote }}
