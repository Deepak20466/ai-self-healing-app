name: CI failure -> AI fix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  notify-on-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: POST the failed run to the healer webhook (starts the AI CI-fix flow)
        # SOURCE_* (not GITHUB_*): GitHub Actions silently ignores a step's
        # attempt to override its own reserved GITHUB_* env vars with the
        # runner's real values for the CURRENTLY EXECUTING workflow (this
        # one, ci-failure.yml) -- see ci_webhook_notify.py's comment. Using
        # non-reserved names is the only way to actually pass through the
        # original CI run's real run id/branch/sha/workflow name.
        env:
          HEALER_WEBHOOK_URL: ${{ vars.HEALER_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.HEALER_WEBHOOK_SECRET }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: python scripts/ci_webhook_notify.py --status finished --conclusion failure
